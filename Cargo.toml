[workspace]
resolver = "2"
members = [
  "crates/libs/mssf-ext",
  "crates/libs/mssf-rplctr",
  "crates/samples/kvmap",
]

[workspace.dependencies]
mssf-ext = { path = "./crates/libs/mssf-ext"}
mssf-com = { version = "0.10" }
mssf-core = "0.10"
mssf-pal = "0.10"
mssf-util = "0.10"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3",  default-features = false, features = ["fmt"]}
trait-variant = "0.1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde_json = "1"
serde = {version = "1", features = ["derive"]}
lazy_static = "1"
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
